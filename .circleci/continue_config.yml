version: '2.1'

# Continuation phase selected by .circleci/config.yml path filtering.
#
# Relevant feature-branch commits build and validate a candidate. Relevant
# master commits build, validate, publish, promote, and verify Flux deployment.
#
# ┌─ Image build (machine) ──────────────────────────────────────────────────────┐
# │  debian-trixie (debian-13:current / trixie-medium):                          │
# │    1) unit-test compile (-DUNIT_TESTS) + TAP gate                           │
# │    2) production docker build/push to Zot (ehws-1password-secrets)          │
# │  Same job/OS so a failed unit build never starts the image build.           │
# │  OpenSIPS needs a separate -DUNIT_TESTS binary; that is two makes, not two  │
# │  CircleCI jobs.                                                             │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# ┌─ OIDC flow (cluster jobs) ───────────────────────────────────────────────────┐
# │  CIRCLE_OIDC_TOKEN_V2 is auto-injected for jobs in the ehws-authentik-oidc  │
# │  context.  It is a short-lived JWT signed by CircleCI Server.               │
# │                                                                              │
# │  kubernetes-cluster  →  kubeconfig (cluster-reader + registry-push-auth)   │
# │    USE FOR: validate / promote / verify orchestration                       │
# │                                                                              │
# │  Promote still copies tags via an in-cluster crane Job that mounts          │
# │  registry-push-auth; that credential never enters CircleCI.                 │
# │  Direct zot-ci bearer auth was retired because it broke Zot OpenID login.   │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Context: ehws-authentik-oidc
#   AUTHENTIK_OIDC_TOKEN_URL — Authentik token endpoint
#   AUTHENTIK_CLIENT_ID      — kubernetes-cluster (for kubectl OIDC)
#   KUBE_API_SERVER          — K3s API server URL
#   KUBE_CA_B64              — base64-encoded cluster CA certificate
#
# Context: ehws-1password-secrets
#   OP_SERVICE_ACCOUNT_TOKEN — 1Password service account for Zot htpasswd refs

orbs:
  onepassword: onepassword/secrets@1

parameters:
  opensips_version:
    type: string
    default: "4.0.0"
  run_image_pipeline:
    type: boolean
    default: false

executors:
  default:
    docker:
      - image: cimg/base:2026.06
    resource_class: denislemire/ehws

  # KubeVirt Debian 13 (trixie) machine image — real Docker daemon on the VM.
  # Bake: denislemire/circleci-debian; class display name "Trixie Medium".
  debian-trixie:
    machine:
      image: debian-13:current
    resource_class: trixie-medium

commands:
  oidc_kubeconfig:
    description: "Exchange CIRCLE_OIDC_TOKEN_V2 for a short-lived kubeconfig"
    steps:
      - run:
          name: Exchange OIDC token for kubeconfig
          command: |
            set -euo pipefail

            for key in AUTHENTIK_OIDC_TOKEN_URL AUTHENTIK_CLIENT_ID KUBE_API_SERVER KUBE_CA_B64; do
              if [[ -z "${!key:-}" ]]; then
                echo "Missing context variable: ${key}" >&2; exit 1
              fi
            done

            printf '%s' "${KUBE_CA_B64}" | base64 --decode > /tmp/ehws-ca.crt

            access_token="$(
              TOKEN_RESPONSE="$(
                curl -fsSL -X POST "${AUTHENTIK_OIDC_TOKEN_URL}" \
                  -H 'Content-Type: application/x-www-form-urlencoded' \
                  --data-urlencode 'grant_type=client_credentials' \
                  --data-urlencode 'scope=openid profile' \
                  --data-urlencode "client_id=${AUTHENTIK_CLIENT_ID}" \
                  --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
                  --data-urlencode "client_assertion=${CIRCLE_OIDC_TOKEN_V2}"
              )" python3 -c "
            import json, os, sys
            token = json.loads(os.environ['TOKEN_RESPONSE']).get('access_token', '')
            if not token:
                sys.exit(1)
            print(token, end='')
            ")"

            kubectl config set-cluster ehws \
              --server="${KUBE_API_SERVER}" \
              --certificate-authority=/tmp/ehws-ca.crt \
              --embed-certs=true
            kubectl config set-credentials circleci-oidc --token="${access_token}"
            kubectl config set-context ehws --cluster=ehws --user=circleci-oidc
            kubectl config use-context ehws
            kubectl get nodes --request-timeout=20s -o wide

  install_kubectl:
    steps:
      - run:
          name: Install kubectl
          command: |
            set -euo pipefail
            curl --retry 5 --retry-all-errors --connect-timeout 10 -fsSL \
              'https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl' \
              -o /tmp/kubectl
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl

  install_helm:
    steps:
      - run:
          name: Install helm
          command: |
            set -euo pipefail
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
              | bash

jobs:
  build-image:
    executor: debian-trixie
    environment:
      ZOT_USERNAME: op://EhWS Secrets/Registry EHWS - Zot htpasswd/username
      ZOT_PASSWORD: op://EhWS Secrets/Registry EHWS - Zot htpasswd/password
      DEBIAN_FRONTEND: noninteractive
      OPENSIPS_GIT_REF: "<< pipeline.parameters.opensips_version >>"
    steps:
      - checkout
      - run:
          name: Install Trixie build deps (unit tests + op CLI)
          command: |
            set -euo pipefail
            # Match docker/Dockerfile builder packages (libpcre2 — Trixie has no libpcre3).
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              unzip ca-certificates git build-essential bison flex pkg-config \
              libssl-dev libncurses-dev libxml2-dev libpcre2-dev \
              libcurl4-openssl-dev libhiredis-dev libmariadb-dev libmariadb-dev-compat \
              default-libmysqlclient-dev libjson-c-dev libevent-dev \
              libxmlrpc-core-c3-dev libperl-dev libmemcached-dev \
              libmicrohttpd-dev libuuid1 uuid-dev \
              perl libtap-formatter-junit-perl
      - run:
          name: Unit-test compile and run (TAP gate before image build)
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            SRC=/tmp/opensips-unit
            rm -rf "${SRC}"
            mkdir -p "${SRC}"
            git clone --depth 1 --branch "${OPENSIPS_GIT_REF}" \
              https://github.com/OpenSIPS/opensips.git "${SRC}/opensips"
            git clone --depth 1 https://github.com/zorgnax/libtap.git \
              "${SRC}/opensips/lib/libtap"
            make -C "${SRC}/opensips/lib/libtap" CFLAGS="-O1 -fPIC" libtap.a
            cd "${SRC}/opensips"
            make Makefile.conf
            printf 'DEFS+= -I%s/lib/libtap\nLIBS+= -L%s/lib/libtap\n' \
              "${SRC}/opensips" "${SRC}/opensips" >> Makefile.conf
            make -j"$(nproc)" DEFS_EXTRA_OPTS="-DUNIT_TESTS -fPIC" opensips
            # Capture TAP even on failure so JUnit/artifacts still publish.
            set +e
            ./opensips -dd -T core -w . -a HP_MALLOC 2>&1 | tee /tmp/unit-tests.tap
            status=${PIPESTATUS[0]}
            set -e
            exit "${status}"
      - run:
          name: Convert TAP output to JUnit XML
          when: always
          command: |
            set -euo pipefail
            mkdir -p /tmp/test-results
            if [[ ! -f /tmp/unit-tests.tap ]]; then
              echo "No TAP output captured" >&2
              exit 1
            fi
            cp /tmp/unit-tests.tap /tmp/test-results/unit-tests.tap
            prove --formatter TAP::Formatter::JUnit --merge \
              --exec cat /tmp/unit-tests.tap > /tmp/test-results/junit.xml
      - store_test_results:
          when: always
          path: /tmp/test-results
      - store_artifacts:
          when: always
          path: /tmp/test-results
      - onepassword/install-cli:
          # Orb default is 2.7.1; service accounts need CLI >= 2.18.0.
          version: "2.34.1"
          path: /usr/local/bin
      - run:
          name: Verify op CLI
          command: |
            set -euo pipefail
            command -v op
            op --version
            echo 'export PATH="/usr/local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Build and push candidate image to Zot
          no_output_timeout: 75m
          shell: op run -- /bin/bash
          command: |
            set -euo pipefail

            REGISTRY="registry.ehws.generic.business"
            IMAGE="${REGISTRY}/ehws/opensips"
            RELEASE_TAG="<< pipeline.parameters.opensips_version >>-ehws.<< pipeline.number >>"
            IMAGE_TAG="${RELEASE_TAG}-candidate"

            printf '%s' "${ZOT_PASSWORD}" \
              | docker login "${REGISTRY}" -u "${ZOT_USERNAME}" --password-stdin

            docker build --progress=plain \
              -f docker/Dockerfile \
              --build-arg "OPENSIPS_GIT_REF=<< pipeline.parameters.opensips_version >>" \
              --build-arg "EHWS_BUILD=<< pipeline.number >>" \
              --build-arg "OPENSIPS_VERSION=${RELEASE_TAG}" \
              -t "${IMAGE}:${IMAGE_TAG}" \
              .

            docker push "${IMAGE}:${IMAGE_TAG}"
            echo "Pushed: ${IMAGE}:${IMAGE_TAG}"

  validate-image:
    executor: default
    steps:
      - checkout
      - install_kubectl
      - install_helm
      - oidc_kubeconfig
      - run:
          name: Validate rendered config with the built image
          command: |
            set -euo pipefail
            IMAGE_TAG="<< pipeline.parameters.opensips_version >>-ehws.<< pipeline.number >>-candidate"
            RELEASE_TAG="<< pipeline.parameters.opensips_version >>-ehws.<< pipeline.number >>"
            RELEASE="opensips-validation-<< pipeline.number >>"
            JOB="${RELEASE}-config-check"
            VALUES=/tmp/opensips-values.json

            kubectl -n opensips get helmrelease opensips -o jsonpath='{.spec.values}' > "${VALUES}"
            helm template "${RELEASE}" . --namespace opensips -f "${VALUES}" \
              --set-string opensips.image.tag="${IMAGE_TAG}" \
              --set-string validation.expectedVersion="${RELEASE_TAG}" \
              --set-string mariadb.auth.existingSecret=opensips-mariadb-credentials \
              --set validation.enabled=true \
              --show-only templates/configmap.yaml \
              --show-only templates/config-validation-job.yaml \
              | kubectl -n opensips apply -f -

            trap 'kubectl -n opensips delete job "${JOB}" configmap "${RELEASE}" --ignore-not-found --wait=false' EXIT
            kubectl -n opensips wait pod -l "job-name=${JOB}" --for=condition=Ready --timeout=5m
            kubectl -n opensips logs -f "job/${JOB}"
            kubectl -n opensips wait "job/${JOB}" --for=condition=Complete --timeout=5m

  promote-image:
    executor: default
    steps:
      - install_kubectl
      - oidc_kubeconfig
      - run:
          name: Promote validated digest to the Flux-visible tag
          command: |
            set -euo pipefail
            CANDIDATE="<< pipeline.parameters.opensips_version >>-ehws.<< pipeline.number >>-candidate"
            RELEASE="<< pipeline.parameters.opensips_version >>-ehws.<< pipeline.number >>"
            JOB="opensips-promote-<< pipeline.number >>"
            trap 'kubectl -n opensips delete job "${JOB}" --ignore-not-found --wait=false >/dev/null 2>&1 || true' EXIT

            kubectl apply -f - \<<YAML
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: ${JOB}
              namespace: opensips
            spec:
              ttlSecondsAfterFinished: 3600
              backoffLimit: 0
              template:
                spec:
                  automountServiceAccountToken: false
                  restartPolicy: Never
                  initContainers:
                    - name: docker-config
                      image: alpine:3.22
                      command: ["/bin/sh", "-c"]
                      args:
                        - |
                          set -eu
                          AUTH=\$(printf 'admin:%s' "\$(cat /zot-auth/password)" | base64 | tr -d '\n')
                          printf '{"auths":{"zot.registry.svc.cluster.local:5000":{"auth":"%s"}}}' \
                            "\$AUTH" > /config/config.json
                      volumeMounts:
                        - {name: zot-auth, mountPath: /zot-auth, readOnly: true}
                        - {name: docker-config, mountPath: /config}
                  containers:
                    - name: crane
                      image: gcr.io/go-containerregistry/crane:debug
                      args:
                        - copy
                        - --insecure
                        - zot.registry.svc.cluster.local:5000/ehws/opensips:${CANDIDATE}
                        - zot.registry.svc.cluster.local:5000/ehws/opensips:${RELEASE}
                      env:
                        - {name: DOCKER_CONFIG, value: /config}
                      volumeMounts:
                        - {name: docker-config, mountPath: /config, readOnly: true}
                  volumes:
                    - {name: docker-config, emptyDir: {}}
                    - name: zot-auth
                      secret: {secretName: registry-push-auth}
            YAML
            kubectl -n opensips wait "job/${JOB}" --for=condition=Complete --timeout=5m
            kubectl -n opensips logs "job/${JOB}" -c crane
            echo "Promoted: registry.ehws.generic.business/ehws/opensips:${RELEASE}"

  verify-deployment:
    executor: default
    steps:
      - install_kubectl
      - oidc_kubeconfig
      - run:
          name: Verify Flux deployment from the external runner
          command: |
            set -euo pipefail
            EXPECTED="<< pipeline.parameters.opensips_version >>-ehws.<< pipeline.number >>"

            for attempt in $(seq 1 180); do
              selected=$(kubectl -n flux-system get imagepolicy opensips -o jsonpath='{.status.latestRef.tag}' 2>/dev/null || true)
              configured=$(kubectl -n opensips get helmrelease opensips -o jsonpath='{.spec.values.opensips.image.tag}' 2>/dev/null || true)
              echo "Flux selected=${selected:-pending} configured=${configured:-pending} expected=${EXPECTED}"
              [[ "${selected}" == "${EXPECTED}" && "${configured}" == "${EXPECTED}" ]] && break
              sleep 10
            done
            [[ "${selected}" == "${EXPECTED}" && "${configured}" == "${EXPECTED}" ]]

            kubectl -n opensips rollout status deployment/opensips --timeout=15m
            kubectl -n opensips rollout status statefulset/mariadb --timeout=15m
            kubectl -n opensips rollout status statefulset/rtpengine --timeout=15m
            deployed=$(kubectl -n opensips get deployment opensips -o jsonpath='{.spec.template.spec.containers[?(@.name=="opensips")].image}')
            [[ "${deployed}" == "registry.ehws.generic.business/ehws/opensips:${EXPECTED}" ]]
            kubectl -n opensips get pods -o wide

  publish-chart:
    executor: default
    steps:
      - checkout
      - install_kubectl
      - install_helm
      - oidc_kubeconfig
      - run:
          name: Fetch Zot push credentials and publish chart
          command: |
            set -euo pipefail
            ZOT_REGISTRY="registry.ehws.generic.business"
            # helm registry login doesn't support bearer tokens; use admin password
            # fetched via OIDC kubectl from the cluster secret (no stored CI creds).
            ZOT_PASS="$(
              kubectl get secret registry-push-auth -n opensips \
                -o jsonpath='{.data.password}' | base64 --decode
            )"
            printf '%s' "${ZOT_PASS}" \
              | helm registry login "${ZOT_REGISTRY}" --username admin --password-stdin
            CHART_VERSION="$(grep '^version:' Chart.yaml | awk '{print $2}')"
            mkdir -p /tmp/charts
            helm package . --destination /tmp/charts/
            helm push "/tmp/charts/opensips-${CHART_VERSION}.tgz" \
              "oci://${ZOT_REGISTRY}"
            echo "Pushed: oci://${ZOT_REGISTRY}/opensips:${CHART_VERSION}"

workflows:
  validate-candidate:
    when:
      and:
        - << pipeline.parameters.run_image_pipeline >>
        - not:
            equal: [master, << pipeline.git.branch >>]
    jobs:
      - build-image:
          context: ehws-1password-secrets
      - validate-image:
          context: ehws-authentik-oidc
          requires:
            - build-image

  release-from-master:
    when:
      and:
        - << pipeline.parameters.run_image_pipeline >>
        - equal: [master, << pipeline.git.branch >>]
    jobs:
      - build-image:
          context: ehws-1password-secrets
      - validate-image:
          context: ehws-authentik-oidc
          requires:
            - build-image
      - publish-chart:
          context: ehws-authentik-oidc
          requires:
            - validate-image
      - promote-image:
          context: ehws-authentik-oidc
          requires:
            - validate-image
      - verify-deployment:
          context: ehws-authentik-oidc
          requires:
            - publish-chart
            - promote-image
